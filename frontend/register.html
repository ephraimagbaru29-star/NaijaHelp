<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - NaijaHelp</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">🇳🇬 NaijaHelp</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="login.html">Login</a>
        <a href="register.html" class="active">Register</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">&#9776;</button>
    </div>
  </header>

  <nav class="mobile-nav" id="mobileNav">
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </nav>

  <!-- Register Form -->
  <main class="auth-page container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Join NaijaHelp and add services to your community</p>
      </div>

      <div id="authAlert" class="alert" role="alert" aria-live="polite" style="display:none;"></div>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Ephraim Agbaru"
            required
            autocomplete="name"
          >
          <span class="field-error" id="fullNameError"></span>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="080XXXXXXXX"
            autocomplete="tel"
          >
          <span class="field-error" id="phoneError"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="At least 8 characters"
              required
              autocomplete="new-password"
            >
            <button type="button" class="toggle-password" aria-label="Show/hide password" data-target="password">👁</button>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-wrap">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Repeat your password"
              required
              autocomplete="new-password"
            >
            <button type="button" class="toggle-password" aria-label="Show/hide confirm password" data-target="confirmPassword">👁</button>
          </div>
          <span class="field-error" id="confirmPasswordError"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
          <span id="registerBtnText">Create Account</span>
          <span id="registerSpinner" class="btn-spinner" style="display:none;"></span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 NaijaHelp.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
